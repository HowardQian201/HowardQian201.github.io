<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found</title>
    <meta http-equiv="refresh" content="3;url=./" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html,body{height:100%}
      body{margin:0;display:grid;place-items:center;font-family:'Manrope',system-ui,sans-serif;background:#ffffff;color:#0f172a;-webkit-font-smoothing:antialiased}
      main{max-width:680px;padding:24px;text-align:center}
      h1{font-size:clamp(28px,5vw,44px);margin:0 0 12px;letter-spacing:-0.02em;font-weight:600}
      p{margin:0 0 8px;opacity:.75}
      a{color:#2563eb;text-decoration:underline;text-underline-offset:4px}
    </style>
  </head>
  <body>
    <main>
      <h1>404 — Not Found</h1>
      <p>The page you were looking for does not exist.</p>
      <p><a href="./">Return home</a></p>
    </main>
  </body>
</html>
